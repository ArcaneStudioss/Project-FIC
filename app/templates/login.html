<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — {{ cfg.get('sigla', 'Sistema') }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    :root {
      --bg: {{ cfg.get('cor_fundo', '#0b0c0e') }};
      --painel: {{ cfg.get('cor_painel', '#16181c') }};
      --borda: {{ cfg.get('cor_borda', '#2a2d33') }};
      --texto: {{ cfg.get('cor_texto', '#e9eaec') }};
      --texto-fraco: {{ cfg.get('cor_texto_fraco', '#9aa0a8') }};
      --destaque: {{ cfg.get('cor_destaque', '#7fa3bd') }};
      --perigo: {{ cfg.get('cor_perigo', '#c1584f') }};
    }
  </style>
</head>
<body>
  <div class="tela-login">
    <div class="cartao-login">
      <img class="logo" src="/static/img/logo.png" alt="Logo">
      <h1>{{ cfg.get('sigla', 'DIP') }}</h1>
      <div class="subtitulo">{{ cfg.get('nome_cidade', 'Cidade do Hype') }}</div>
      {% if erro %}<div class="erro-login">{{ erro }}</div>{% endif %}
      <form method="post" action="/login">
        <div class="campo">
          <label>Usuário</label>
          <input type="text" name="username" required autofocus>
        </div>
        <div class="campo">
          <label>Senha</label>
          <input type="password" name="senha" required>
        </div>
        <button class="botao" type="submit" style="width:100%;">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
