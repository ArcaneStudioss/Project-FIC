{% extends "base.html" %}
{% block conteudo %}
<div class="topo-pagina">
  <div>
    <h1>Configurações do Site</h1>
    <div class="legenda">Tudo aqui é aplicado na hora, sem precisar mexer em nenhum arquivo</div>
  </div>
</div>

<div class="painel-secao">
  <h2 class="titulo-secao" style="font-size:14px;">Identidade</h2>
  <form class="form-inline" method="post" action="/admin/configuracoes/cores" style="margin-bottom:16px;">
    <div class="campo"><label>Sigla</label><input type="text" name="sigla" value="{{ cfg.get('sigla','') }}"></div>
    <div class="campo" style="flex:2;"><label>Nome do Órgão</label><input type="text" name="nome_orgao" value="{{ cfg.get('nome_orgao','') }}"></div>
    <div class="campo" style="flex:2;"><label>Cidade</label><input type="text" name="nome_cidade" value="{{ cfg.get('nome_cidade','') }}"></div>

  <h2 class="titulo-secao" style="font-size:14px; margin-top:20px;">Cores</h2>
    <div class="campo"><label>Fundo</label><input type="color" name="cor_fundo" value="{{ cfg.get('cor_fundo','#0b0c0e') }}" style="height:40px;"></div>
    <div class="campo"><label>Painel</label><input type="color" name="cor_painel" value="{{ cfg.get('cor_painel','#16181c') }}" style="height:40px;"></div>
    <div class="campo"><label>Borda</label><input type="color" name="cor_borda" value="{{ cfg.get('cor_borda','#2a2d33') }}" style="height:40px;"></div>
    <div class="campo"><label>Texto</label><input type="color" name="cor_texto" value="{{ cfg.get('cor_texto','#e9eaec') }}" style="height:40px;"></div>
    <div class="campo"><label>Texto Fraco</label><input type="color" name="cor_texto_fraco" value="{{ cfg.get('cor_texto_fraco','#9aa0a8') }}" style="height:40px;"></div>
    <div class="campo"><label>Destaque</label><input type="color" name="cor_destaque" value="{{ cfg.get('cor_destaque','#7fa3bd') }}" style="height:40px;"></div>
    <div class="campo"><label>Sucesso</label><input type="color" name="cor_sucesso" value="{{ cfg.get('cor_sucesso','#5fa87a') }}" style="height:40px;"></div>
    <div class="campo"><label>Alerta</label><input type="color" name="cor_alerta" value="{{ cfg.get('cor_alerta','#c9a227') }}" style="height:40px;"></div>
    <div class="campo"><label>Perigo</label><input type="color" name="cor_perigo" value="{{ cfg.get('cor_perigo','#c1584f') }}" style="height:40px;"></div>
    <button class="botao" type="submit">Salvar</button>
  </form>
</div>

<div class="painel-secao">
  <h2 class="titulo-secao" style="font-size:14px;">Abas do Menu</h2>
  <table>
    <thead><tr><th>Ordem</th><th>Ícone</th><th>Nome</th><th>Visível</th><th></th></tr></thead>
    <tbody>
      {% for aba in todas_abas %}
      <tr>
        <form method="post" action="/admin/abas/{{ aba.id }}">
        <td><input type="number" name="ordem" value="{{ aba.ordem }}" style="width:60px;"></td>
        <td><input type="text" name="icone" value="{{ aba.icone }}" style="width:50px;"></td>
        <td><input type="text" name="rotulo" value="{{ aba.rotulo }}"></td>
        <td><input type="checkbox" name="visivel" style="width:auto;" {{ 'checked' if aba.visivel else '' }}></td>
        <td><button class="botao secundario pequeno" type="submit">Salvar</button></td>
        </form>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
