{% extends "base.html" %}
{% block conteudo %}
<div class="topo-pagina acoes-documento">
  <div>
    <h1>{{ documento.titulo }}</h1>
    <div class="legenda">Gerado por {{ documento.gerado_por.nome_exibicao }} em {{ documento.criado_em.strftime('%d/%m/%Y %H:%M') }}</div>
  </div>
  <button class="botao" onclick="window.print()">Imprimir / Salvar PDF</button>
</div>

{{ documento.conteudo_html | safe }}
{% endblock %}
